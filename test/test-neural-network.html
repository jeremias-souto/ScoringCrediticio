<!DOCTYPE html>

<link rel="stylesheet" href="https://code.jquery.com/qunit/qunit-3.0.0.css">
<body>
    <div id="qunit"></div>

    <script src="../entities/Neuron.js"></script>

    <script>
        QUnit.module('getThreshold', function () {
            QUnit.test('the result must be 4', function (assert) {
                const neuronsList = [new Neuron(1, 3), new Neuron(0, 1), new Neuron(1, 2)];
                const threshold = 4;
                const neuralNetwork = new NeuralNetwork(neuronsList, threshold);
                assert.equal(neuralNetwork.getThreshold(), threshold);
            });
        });
        
        QUnit.module('getNeuronsList', function () {
            QUnit.test('the result must be []', function (assert) {
                const neuronsList = [new Neuron(1, 3), new Neuron(0, 1), new Neuron(1, 2)];
                const threshold = 4;
                const neuralNetwork = new NeuralNetwork(neuronsList, threshold);
                assert.equal(neuralNetwork.getNeuronsList(), neuronsList);
            });
        });

        QUnit.module('sum', function () {
            QUnit.test('the result must be 5', function (assert) {
                const neuronsList = [new Neuron(1, 3), new Neuron(0, 1), new Neuron(1, 2)];
                const threshold = 4;
                const result = 5;
                const neuralNetwork = new NeuralNetwork(neuronsList, threshold);
                assert.equal(neuralNetwork.sum(), result);
            });
        });

        QUnit.module('activationFunction', function () {
            QUnit.test('the result must be true', function (assert) {
                const neuronsList = [new Neuron(1, 3), new Neuron(0, 1), new Neuron(1, 2)];
                const threshold = 4;
                const result = true;
                const neuralNetwork = new NeuralNetwork(neuronsList, threshold);
                assert.equal(neuralNetwork.activationFunction(), result);
            });
        });
